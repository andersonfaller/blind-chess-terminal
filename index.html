<!DOCTYPE html>
<html lang="en" data-theme="phosphor" class="crt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Blind Chess Terminal</title>
  <meta name="description" content="Blindfold chess trainer in your browser: play Stockfish without seeing the board, by text or voice, with visualisation drills, puzzles and game review.">
  <meta name="theme-color" content="#070b07">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply the saved look before first paint (no flash of the default theme).
    try {
      var s = JSON.parse(localStorage.getItem('bct:settings') || '{}');
      if (s.theme) document.documentElement.dataset.theme = s.theme;
      if (s.crt === false) document.documentElement.classList.remove('crt');
      if (s.fontSize) document.documentElement.style.setProperty('--font-size', s.fontSize + 'px');
    } catch (e) { /* storage unavailable */ }
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app">
    <div class="window">
      <header class="titlebar">
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="title">blind-chess <span class="title-dim">— ~/training</span></span>
        <span class="titlebar-right" aria-hidden="true">♞</span>
      </header>
      <main id="output" role="log" aria-live="polite" aria-label="Terminal"></main>
      <div id="status" class="statusbar"></div>
      <nav id="actions" class="actions" aria-label="Quick actions"></nav>
      <form id="prompt-form" class="prompt" autocomplete="off">
        <label id="prompt-label" for="input">❯</label>
        <input id="input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="Command or move" autofocus>
        <button id="mic-btn" class="icon-btn" type="button" title="listen" aria-label="Voice input" hidden>🎙</button>
        <button id="send-btn" class="icon-btn send" type="submit" aria-label="Send">⏎</button>
      </form>
    </div>
  </div>
  <noscript><p class="noscript">Blind Chess Terminal needs JavaScript.</p></noscript>
  <script>
    // If the app modules cannot load (opened from file:// or a very old browser), explain why.
    setTimeout(function () {
      if (window.__bctBooted) return;
      var o = document.getElementById('output');
      if (o && !o.childElementCount) {
        o.innerHTML = '<div class="line err">Could not start the app. Serve this folder over HTTP ' +
          '(for example: <code>python3 -m http.server</code>) and open it in a modern browser.</div>';
      }
    }, 5000);
  </script>
</body>
</html>
